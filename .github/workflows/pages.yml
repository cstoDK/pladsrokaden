# Bygger og udgiver Pladsrokaden på GitHub Pages.
# Kører kun, når den startes manuelt (Actions > "Udgiv på GitHub Pages" > Run workflow).
# Vil I udgive automatisk ved hvert push til main, tilføj:
#   push:
#     branches: [main]
name: Udgiv på GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  byg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  udgiv:
    needs: byg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.udgivelse.outputs.page_url }}
    steps:
      - id: udgivelse
        uses: actions/deploy-pages@v4
